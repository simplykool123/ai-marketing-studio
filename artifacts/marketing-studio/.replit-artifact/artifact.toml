kind = "web"
previewPath = "/"
title = "AI Marketing Studio"
version = "1.0.0"
id = "artifacts/marketing-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22628

[services.development]
run = "pnpm --filter @workspace/marketing-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketing-studio", "run", "build" ]
publicDir = "artifacts/marketing-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22628"
BASE_PATH = "/"
